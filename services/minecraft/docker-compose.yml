services:
  mc:
    image: itzg/minecraft-server
    container_name: paper-server
    tty: true
    stdin_open: true
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      MEMORY: 96G
      VERSION: 1.21.10
      DIFFICULTY: hard
      MOTD: "§l§cMcDaServeur de retour"
    networks:
      - homeserver-net
    volumes:
      - ./paper-server-data:/data
    restart: unless-stopped

networks:
  homeserver-net:
    external: true
