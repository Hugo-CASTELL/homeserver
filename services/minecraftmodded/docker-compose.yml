services:
  mc-modded:
    image: itzg/minecraft-server
    container_name: modded-server
    tty: true
    stdin_open: true
    environment:
      EULA: "TRUE"
      TYPE: MODRINTH
      MODRINTH_LOADER: fabric
      MODRINTH_MODPACK: shFhR8Vx
      VERSION: 1.20.1
      MEMORY: 32G
      DIFFICULTY: hard
      MOTD: "§l§cMcDaServeur moddé enfin disponible"
    networks:
      - closed-homeserver-net
    volumes:
      - ./modded-server-data:/data
    restart: unless-stopped

networks:
  closed-homeserver-net:
    external: true
